{% extends "base.html" %}

{% block title %}User Registration{% endblock %}

{% block content %}
  <section class="user-creation-form">
    <h1>Create an Account</h1>

    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button type="submit">Register</button>
    </form>
  </section>
{% endblock %}
