{% extends "base.html" %}

{% block title %}User Details{% endblock %}

{% block content %}
  <section class="user-detail">
    <h1>User Details</h1>

    <dl>
      <dt>Username</dt>
      <dd>{{ object.username }}</dd>

      <dt>Email</dt>
      <dd>{{ object.email|default:"—" }}</dd>

      <dt>Role</dt>
      <dd>{{ object.get_role_display }}</dd>

      <dt>Date joined</dt>
      <dd>{{ object.date_joined|date:"d M Y H:i" }}</dd>
    </dl>
  </section>
{% endblock %}
