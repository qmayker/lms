{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    {% block title %}
        
    {% endblock title %}
    </title>
    {% block extra_css %}{% endblock %}
</head>
<body>
    
    <div class="registration">
    {% if user.is_authenticated %}
        <a href="#" class="logout", data-url="{% url 'registration:logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'registration:login' %}" class="login"></a>
    {% endif %}
    </div>
        
    {% block content %}
        
    {% endblock content %}     
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>
    <script src="{% static 'js/logout.js' %}"></script>
    
    {% block scripts %}
        
    {% endblock scripts %}
        
</body>
</html>
